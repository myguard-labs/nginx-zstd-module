---
# yamllint disable rule:line-length rule:truthy
name: Arch package

on:
  workflow_dispatch: {}
  workflow_call: {}

concurrency:
  group: arch-package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  package:
    name: Build package and checkout
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout module
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Build and test Arch package and checkout
        run: packaging/arch/build.sh

      - name: Upload Arch package
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: nginx-mod-zstd-release-arch-package
          path: packaging/arch/dist/*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 7
