name: Fuzzing

# Fast fuzz regression gate on every PR/push — 120s libFuzzer run on the
# Accept-Encoding target so PR feedback stays quick. The long (hours) fuzz
# run lives in ci-deep.yml (monthly cron + workflow_dispatch).
#
# Action pins (keep in sync with build-test.yml header):
# actions/checkout@v5        -> 93cb6efe18208431cddfb8368fd83d5badbf9bfd
# actions/upload-artifact@v5 -> 330a01c490aca151604b8cf639adc76d48f6c5d4

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NGINX_VERSION: ""

on:
  workflow_dispatch: {}
  # Called by ci.yml, the single PR entry point (step 15).
  workflow_call: {}

concurrency:
  group: fuzzing-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fuzz-regression:
    name: Fuzz regression (120s)
    runs-on: ${{ fromJSON(vars.POOL || '["ubuntu-latest"]') }}
    timeout-minutes: 30
    steps:
      - name: Checkout module
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Install clang + libFuzzer
        run: |
          # builder02 apt profile: loose timeouts — the box runs jobs
          # concurrently and never talks to the Azure mirror (PR #121)
          printf '%s\n' \
            'DPkg::Lock::Timeout "120";' \
            'Acquire::Retries "3";' \
            'Acquire::http::Timeout "20";' \
            'Acquire::https::Timeout "20";' \
            | sudo tee /etc/apt/apt.conf.d/99-ci-net > /dev/null
          sudo apt-get update
          sudo apt-get install -y clang

      - name: Build fuzz targets
        run: |
          bash ci/fuzz/build.sh \
            "$GITHUB_WORKSPACE/ci/fuzz/fuzz_accept_encoding" \
            "$GITHUB_WORKSPACE/ci/fuzz/fuzz_dcz"

      # Replay every triaged past crash FIRST -- fast (each is one input)
      # and deterministic, so a reintroduced bug fails in seconds instead
      # of waiting on the 120s fresh budget to happen to rediscover it.
      # Currently empty (see ci/fuzz/regressions/README.md) -- the glob
      # guard below keeps that from being a silent no-op forever: an
      # empty directory is a real state, not a bug, but a stale directory
      # that stopped matching anything after a rename WOULD be, so this
      # step still reports its case count explicitly either way.
      - name: Replay recorded crash regressions
        run: |
          set -euo pipefail
          cd ci/fuzz
          shopt -s nullglob
          cases=(regressions/crash-*)
          if [ "${#cases[@]}" -eq 0 ]; then
            echo "no recorded regressions yet (ci/fuzz/regressions/ is empty)"
          else
            echo "replaying ${#cases[@]} recorded crash(es)"
            ./fuzz_accept_encoding "${cases[@]}"
            echo "✓ all recorded regressions still pass"
          fi

      - name: Run fuzzer (120s regression)
        run: |
          set -euo pipefail
          cd ci/fuzz
          set +e
          ./fuzz_accept_encoding \
            -max_total_time=120 \
            -dict=fuzz.dict \
            -print_final_stats=1 \
            -artifact_prefix=crash- \
            corpus/
          rc=$?
          set -e
          [ $rc -eq 0 ] || { echo "❌ fuzzer crash (exit $rc)"; exit 1; }
          echo "✓ no crashes in 120s"

      - name: Run dcz fuzzer (120s regression)
        run: |
          set -euo pipefail
          cd ci/fuzz
          set +e
          ./fuzz_dcz \
            -max_total_time=120 \
            -print_final_stats=1 \
            -artifact_prefix=crash-dcz- \
            corpus_dcz/
          rc=$?
          set -e
          [ $rc -eq 0 ] || { echo "❌ dcz fuzzer crash (exit $rc)"; exit 1; }
          echo "✓ no crashes in 120s"

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: fuzz-fast-crashes
          path: |
            ${{ github.workspace }}/ci/fuzz/crash-*
            ${{ github.workspace }}/ci/fuzz/crash-dcz-*
          retention-days: 14
