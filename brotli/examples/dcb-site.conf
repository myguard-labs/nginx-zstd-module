# Example nginx config for RFC 9842 dcb on content-hashed assets.
# This is a per-site file, and both blocks in it -- the map and the
# server -- are only valid INSIDE http{}. Drop it into conf.d/ or
# sites-enabled/, which nginx.conf includes from within http{}; pasted
# at the top level of nginx.conf, or inside another server{}, it fails
# with '"map" directive is not allowed here'.
# Adapt the paths and asset patterns, then see make-dcb-dictionaries.sh
# for the deploy-time half.
#
# In the http{} block of nginx.conf itself (shared by every site, so
# not in this per-site file), consider:
#
#     brotli_dcb_dict_trust_hashes on;
#
# The deploy script below emits each dictionary line WITH its sha256
# literal. By default those literals are verified -- the file is hashed
# at every nginx -t and reload anyway, and a mismatch fails the load.
# This deployment IS the content-addressed pipeline the trust opt-in
# exists for (the script derives each hash from the exact file it
# registers), so trusting the literals skips the hashing pass entirely
# and keeps reload time flat as dictionaries accumulate. Must appear
# before the include that loads the dictionary list.

# Compute the Use-As-Dictionary value once per request. An empty value
# makes add_header emit nothing, so non-asset requests are untouched.
#
# Keyed on $request_uri (the URL the browser asked for), NOT $uri:
# try_files and internal rewrites change $uri, and the match pattern
# must be scoped to browser-facing URLs. The (?:\?.*)?$ tail tolerates
# query strings.
map $request_uri $dcb_match {
    ~^/assets/(?<base>main|polyfills|vendor)-[^./?]+\.js(?:\?.*)?$  'match="/assets/$base-*.js"';
    ~^/assets/styles-[^./?]+\.css(?:\?.*)?$                         'match="/assets/styles-*.css"';
    default '';
}

server {
    listen 443 ssl;                # dictionaries require HTTPS
    http2 on;
    server_name example.com;

    root /var/www/app/current;     # deploys flip this symlink

    location /assets/ {
        gzip_vary on;

        brotli on;
        brotli_min_length 1024;
        brotli_types application/javascript text/css;

        # Hashed filenames are immutable; long cache is what makes the
        # planted dictionary survive until the next deploy.
        expires max;
        add_header Cache-Control "public, immutable";

        # Advertise the resource as a dictionary for its own pattern.
        add_header Use-As-Dictionary $dcb_match always;

        # Deploy-generated brotli_dcb_dict_file directives. MUST be
        # `include` — passing the list file to brotli_dcb_dict_file
        # would load the list itself as a dictionary that matches
        # nothing. Bootstrap with an empty file so nginx -t passes
        # before the first deploy.
        include /etc/nginx/dcb-dictionaries.conf;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
